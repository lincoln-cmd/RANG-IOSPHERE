name: Repository mirrors

on:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-mirrors
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror Git repository backups
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Fetch GitHub main and tags
        env:
          SOURCE_URL: https://github.com/${{ github.repository }}.git
        run: |
          git init --bare repository.git
          git -C repository.git fetch --prune "$SOURCE_URL" \
            '+refs/heads/main:refs/heads/main' \
            '+refs/tags/*:refs/tags/*'

      - name: Push GitLab backup
        env:
          MIRROR_URL: ${{ secrets.GITLAB_MIRROR_URL }}
        run: |
          if [ -z "$MIRROR_URL" ]; then
            echo "GitLab 미러 주소가 등록되지 않아 건너뜁니다."
            exit 0
          fi
          git -C repository.git push "$MIRROR_URL" \
            refs/heads/main:refs/heads/github-main \
            'refs/tags/*:refs/tags/*'

      - name: Push Bitbucket backup
        env:
          MIRROR_URL: ${{ secrets.BITBUCKET_MIRROR_URL }}
        run: |
          if [ -z "$MIRROR_URL" ]; then
            echo "Bitbucket 미러 주소가 등록되지 않아 건너뜁니다."
            exit 0
          fi
          git -C repository.git push "$MIRROR_URL" \
            refs/heads/main:refs/heads/github-main \
            'refs/tags/*:refs/tags/*'
