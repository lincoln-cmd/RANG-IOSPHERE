name: Daily production health check

on:
  schedule:
    # 매일 한국 시간 오전 6시 17분경 실행됩니다.
    - cron: "17 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-production-health
  cancel-in-progress: true

jobs:
  health:
    name: Verify public site
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out current main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check production pages and public data
        run: node scripts/smoke-test.mjs
        env:
          SITE_URL: https://rang-iosphere.pages.dev
          SMOKE_ATTEMPTS: "1"
          REQUIRE_SEARCH_VERIFICATION: "true"
