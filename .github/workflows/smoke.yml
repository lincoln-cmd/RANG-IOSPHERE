name: Deployment smoke test

on:
  workflow_run:
    workflows: ["Quality checks"]
    types: [completed]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "확인할 배포 커밋 SHA (비우면 현재 커밋)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-smoke-test
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: Verify production deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for and verify Cloudflare Pages deployment
        run: node scripts/smoke-test.mjs
        env:
          SITE_URL: https://rang-iosphere.pages.dev
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || inputs.expected_sha || github.sha }}
          REQUIRE_SEARCH_VERIFICATION: "true"
