version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    ignore:
      # Astro 메이저 버전은 마이그레이션 작업에서 별도로 검증합니다.
      - dependency-name: astro
        update-types:
          - version-update:semver-major
    groups:
      safe-runtime-updates:
        dependency-type: production
        update-types:
          - minor
          - patch
      safe-development-updates:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:40"
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
